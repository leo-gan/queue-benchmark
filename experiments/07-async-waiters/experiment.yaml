schema: gld.experiment.config/1
id: 07-async-waiters
title: How does an async queue behave with many waiting consumers?
question: >
  One producer, 32 waiting async consumers, small messages. What is handoff time?
story:
  why: Event loops can have thousands of parked tasks. That is not the same as two threads.
  example: An asyncio service with many waiters on one queue.
  tradeoff: A library that is fast with two tasks can crawl with 32 waiters.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [1p32c]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: asyncio.Queue, role: event-loop queue}
      - {name: janus, role: third-party async queue}
  - id: rust
    enabled: true
    libraries:
      - {name: tokio-mpsc, role: async MPSC}
      - {name: async-channel, role: async MPMC}
  - id: csharp
    enabled: true
    libraries:
      - {name: Channel, role: async channel}
