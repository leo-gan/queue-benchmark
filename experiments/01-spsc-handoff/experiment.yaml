schema: gld.experiment.config/1
id: 01-spsc-handoff
title: Which queue is fastest for SPSC handoff?
question: >
  One producer hands one small message (256 bytes) to one consumer, many
  times. Which in-process queue is fastest in each language?
story:
  why: Most services start with one writer and one reader in the same process.
  example: A request thread puts work on a queue; a worker thread takes it.
  tradeoff: A lock around a deque is simple. A lock-free or async channel may
    be faster, but only if the extra machinery is cheaper than the lock.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 120
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: deque-lock, role: locked baseline}
      - {name: queue.Queue, role: threading MPMC used as SPSC}
      - {name: queue.SimpleQueue, role: unbounded threading MPMC used as SPSC}
      - {name: asyncio.Queue, role: event-loop queue}
      - {name: janus, role: third-party async queue}
  - id: rust
    enabled: true
    libraries:
      - {name: std-mpsc, role: standard MPSC}
      - {name: crossbeam-channel, role: MPMC channel}
      - {name: flume, role: third-party MPMC}
      - {name: crossbeam-queue, role: lock-free MPMC}
      - {name: tokio-mpsc, role: async MPSC}
      - {name: async-channel, role: async MPMC}
  - id: javascript
    enabled: true
    libraries:
      - {name: Array, role: push/shift baseline}
      - {name: denque, role: O(1) circular FIFO}
      - {name: yocto-queue, role: O(1) linked-list FIFO}
      - {name: fastq, role: job queue}
      - {name: p-queue, role: scheduler (not ranked as a queue)}
  - id: csharp
    enabled: true
    libraries:
      - {name: Queue+lock, role: locked baseline}
      - {name: ConcurrentQueue, role: concurrent MPMC}
      - {name: Channel, role: async channel}
  - id: c
    enabled: true
    libraries:
      - {name: mutex-queue, role: locked ring}
      - {name: spsc-ring, role: SPSC ring}
