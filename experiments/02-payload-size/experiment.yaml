schema: gld.experiment.config/1
id: 02-payload-size
title: Does payload size change the ranking?
question: >
  Same SPSC handoff as experiment 1, but the payload is a 4 KiB document
  instead of a 256-byte message. Does the ranking stay the same?
story:
  why: A ranking on tiny messages can hide copy cost that only shows up on bigger payloads.
  example: A worker queue that moves whole HTTP bodies, not 256-byte tickets.
  tradeoff: If the ranking flips, the “fastest queue” from experiment 1 is
    not a general answer.

sample:
  kind: document
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 120
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: deque-lock, role: locked baseline}
      - {name: queue.Queue, role: threading queue}
      - {name: queue.SimpleQueue, role: unbounded threading queue}
      - {name: asyncio.Queue, role: event-loop queue}
      - {name: janus, role: third-party async queue}
  - id: rust
    enabled: true
    libraries:
      - {name: std-mpsc, role: standard MPSC}
      - {name: crossbeam-channel, role: MPMC channel}
      - {name: flume, role: third-party MPMC}
      - {name: crossbeam-queue, role: lock-free MPMC}
      - {name: tokio-mpsc, role: async MPSC}
      - {name: async-channel, role: async MPMC}
  - id: javascript
    enabled: true
    libraries:
      - {name: Array, role: push/shift baseline}
      - {name: denque, role: O(1) circular FIFO}
      - {name: yocto-queue, role: O(1) linked-list FIFO}
      - {name: fastq, role: job queue}
      - {name: p-queue, role: scheduler (not ranked as a queue)}
  - id: csharp
    enabled: true
    libraries:
      - {name: Queue+lock, role: locked baseline}
      - {name: ConcurrentQueue, role: concurrent MPMC}
      - {name: Channel, role: async channel}
  - id: c
    enabled: true
    libraries:
      - {name: mutex-queue, role: locked ring}
      - {name: spsc-ring, role: SPSC ring}
