schema: gld.experiment.config/1
id: 05-wakeup
title: How long does an empty-queue consumer take to wake?
question: >
  The consumer waits on an empty queue. The producer sleeps, then puts one item. How long until the consumer has the item?
story:
  why: Handoff time when the queue is already full of work is not the same as wakeup cost.
  example: A worker parks until the next request arrives.
  tradeoff: A condition variable sleeps the core; a spin loop burns it.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: deque-lock, role: locked baseline}
      - {name: queue.Queue, role: threading queue}
  - id: csharp
    enabled: true
    libraries:
      - {name: Queue+lock, role: locked baseline}
      - {name: ConcurrentQueue, role: concurrent}
  - id: rust
    enabled: true
    libraries:
      - {name: crossbeam-channel, role: concurrent}
  - id: c
    enabled: true
    libraries:
      - {name: mutex-queue, role: locked baseline}
  - id: javascript
    enabled: true
    libraries:
      - {name: Array, role: locked baseline}
