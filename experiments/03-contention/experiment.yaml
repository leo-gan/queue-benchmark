schema: gld.experiment.config/1
id: 03-contention
title: Does ranking change under 1P4C, 4P1C, and 4P4C?
question: >
  Same small message, but one producer and four consumers, four producers and one consumer, then four of each. Does the SPSC ranking still hold?
story:
  why: Real services rarely have exactly one writer and one reader.
  example: Several request threads put work; a pool of workers take it.
  tradeoff: A lock that looked cheap at 1P1C can convoy under many producers.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [1p4c, 4p1c, 4p4c]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: deque-lock, role: locked baseline}
      - {name: queue.Queue, role: threading MPMC}
      - {name: queue.SimpleQueue, role: unbounded threading MPMC}
      - {name: spsc-ring, role: SPSC ring}
  - id: rust
    enabled: true
    libraries:
      - {name: crossbeam-channel, role: MPMC channel}
      - {name: flume, role: third-party MPMC}
      - {name: crossbeam-queue, role: lock-free MPMC}
  - id: csharp
    enabled: true
    libraries:
      - {name: ConcurrentQueue, role: concurrent MPMC}
      - {name: BlockingCollection, role: blocking MPMC}
      - {name: Channel, role: async channel}
  - id: c
    enabled: true
    libraries:
      - {name: mutex-queue, role: locked ring}
  - id: javascript
    enabled: true
    libraries:
      - {name: fastq, role: job queue}
