schema: gld.experiment.config/1
id: 04-backpressure
title: What happens when the queue is bounded and the consumer is slower?
question: >
  The queue holds at most 32 messages. Consumers wait 5 microseconds per item. How do enqueue time and handoff change?
story:
  why: A bounded queue is backpressure. Unbounded queues hide overload until memory is gone.
  example: A worker cannot keep up; producers must wait instead of filling RAM.
  tradeoff: Blocking on full is a feature, not a failure.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: queue.Queue, role: bounded threading queue}
      - {name: asyncio.Queue, role: bounded async queue}
      - {name: janus, role: bounded third-party async queue}
  - id: c
    enabled: true
    libraries:
      - {name: mutex-queue, role: bounded mutex ring}
