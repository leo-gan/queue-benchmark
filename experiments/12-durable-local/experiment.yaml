schema: gld.experiment.config/1
id: 12-durable-local
title: What does local durability cost versus an in-memory queue?
question: >
  A SQLite-backed queue with fsync off, then on. How much slower is a durable put/get than queue.Queue?
story:
  why: Disk and fsync dominate. This is not a lock benchmark.
  example: A crash-safe local job table.
  tradeoff: Never rank this next to a deque.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: sqlite-queue, role: durable local queue}
