schema: gld.experiment.config/1
id: 11-shared-memory
title: Does a shared-memory ring beat pickle IPC on a small payload?
question: >
  A mapped SPSC ring versus multiprocessing.Queue for a 256-byte message.
story:
  why: Shared memory skips pickle of the body. That only matters if the copy path is the cost.
  example: Two processes share a ring of bytes.
  tradeoff: Still category S, not T.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: shared-ring, role: mapped SPSC ring}
  - id: csharp
    enabled: true
    libraries:
      - {name: shared-ring, role: mapped SPSC ring}
  - id: rust
    enabled: true
    libraries:
      - {name: shared-ring, role: mapped SPSC ring}
  - id: c
    enabled: true
    libraries:
      - {name: shared-ring, role: mapped SPSC ring}
  - id: javascript
    enabled: true
    libraries:
      - {name: shared-ring, role: SharedArrayBuffer ring}
