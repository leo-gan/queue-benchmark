schema: gld.experiment.config/1
id: 08-async-backpressure
title: Does a bounded async queue apply backpressure?
question: >
  An async queue with maxsize 32 and a slow consumer. Do producers wait instead of growing memory?
story:
  why: Async backpressure uses the event loop, not an OS mutex.
  example: An async worker is slow; producers must await put().
  tradeoff: The same bound as threads, different waiter.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: asyncio.Queue, role: event-loop queue}
      - {name: janus, role: third-party async queue}
  - id: rust
    enabled: true
    libraries:
      - {name: tokio-mpsc, role: async MPSC}
  - id: csharp
    enabled: true
    libraries:
      - {name: Channel, role: async channel}
