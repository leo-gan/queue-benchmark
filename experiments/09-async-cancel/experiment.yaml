schema: gld.experiment.config/1
id: 09-async-cancel
title: How fast can waiting async consumers be cancelled?
question: >
  Many tasks wait on an empty async queue. Cancel them all. How long does teardown take, and is the queue still sound?
story:
  why: Cancelled waiters are a common source of leaks and double-gets.
  example: A request times out while its worker is parked on get().
  tradeoff: Fast cancel that loses or doubles a message is not a win.

sample:
  kind: message
  records_per_write: 100
  seed: 42
  settings: {}
  saved_as: sample.bin

run:
  mode: all-single
  io_modes: [bytes]
  compression: none
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 180
  reps_fallback: 10

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: bytes
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: asyncio.Queue, role: event-loop queue}
  - id: rust
    enabled: true
    libraries:
      - {name: tokio-mpsc, role: async MPSC}
  - id: csharp
    enabled: true
    libraries:
      - {name: Channel, role: async channel}
  - id: javascript
    enabled: true
    libraries:
      - {name: p-queue, role: scheduler cancel}
