name: Benchmark CI

# Per-language smoke when that language's source changes; analysis unit tests
# when analysis/ or shared config/scripts change. Pure docs PRs are skipped.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'LICENSE.*'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'site/**'
      - 'dashboard/**'
      - '.grok/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'LICENSE.*'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'site/**'
      - 'dashboard/**'
      - '.grok/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - all-single
          - full

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      csharp: ${{ steps.filter.outputs.csharp }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      c: ${{ steps.filter.outputs.c }}
      javascript: ${{ steps.filter.outputs.javascript }}
      analysis: ${{ steps.filter.outputs.analysis }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            csharp:
              - 'c-sharp/**'
              - 'schemas/data_catalog_v2.yaml'
            python:
              - 'python/**'
              - 'schemas/data_catalog_v2.yaml'
            rust:
              - 'rust/**'
              - 'schemas/data_catalog_v2.yaml'
            c:
              - 'c/**'
              - 'schemas/data_catalog_v2.yaml'
            javascript:
              - 'javascript/**'
              - 'schemas/data_catalog_v2.yaml'
            analysis:
              - 'analysis/**'
              - 'config/benchmark_config.yaml'
              - 'schemas/data_catalog_v2.yaml'
              - 'scripts/lib/**'
              - 'scripts/read-config.py'
              - 'scripts/run-all-benchmarks.sh'
              - 'scripts/verify-results.sh'
              - 'scripts/check-host-requirements.sh'
              - 'scripts/install-host-requirements.sh'
              - 'scripts/emit-cells-tsv.py'
              - '.github/workflows/benchmark-ci.yml'

  csharp-benchmark:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: ./scripts/check-host-requirements.sh csharp
      - run: cd c-sharp && ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  python-benchmark:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'python/uv.lock'
      - run: uv python install 3.12
      - run: ./scripts/check-host-requirements.sh python
      - run: cd python && ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  rust-benchmark:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: ./scripts/check-host-requirements.sh rust
      - run: cd rust && ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  c-benchmark:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: ./scripts/check-host-requirements.sh c
      - run: cd c && ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  javascript-benchmark:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: cd javascript && npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: ./scripts/check-host-requirements.sh javascript
      - run: cd javascript && ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  analysis-unit-tests:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.analysis == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis package with test deps
        run: |
          cd analysis
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: Run unit tests
        run: cd analysis && .venv/bin/pytest -q
      - name: Smoke read-config
        run: |
          set -euo pipefail
          PY=analysis/.venv/bin/python
          $PY scripts/read-config.py --enabled-langs | grep -qw python
          $PY scripts/read-config.py --enabled-langs | grep -qw rust
          $PY scripts/read-config.py --lang-runners | grep -E '^(csharp|python|rust|c|javascript)\|'
          test "$($PY scripts/read-config.py --mode-reps smoke)" = "2"
