# Suite type catalog (logical definitions + default type_config)
# For queues, type_id selects a payload size / shape. Runners build opaque
# byte strings of payload_bytes; they do not serialize object graphs.
data_model_version: 2

primitives:
  all_available:
    - bool
    - int32
    - int64
    - float64
    - utf8_string
  datetime: int64_epoch_ms

forbidden_type_config_keys:
  - seed
  - type_id
  - data_type_instance_count
  - instance_count
  - batch_size
  - n
  - return_array_even_for_1_instance

types:
  message:
    description: "Small message payload"
    category: flat_mixed
    default_type_config:
      payload_bytes: 256
      field_count: 8
      primitive_types: all_available
      string_len:
        min: 3
        max: 16
      int_range:
        min: 0
        max: 1000000

  document:
    description: "Larger document payload"
    category: nested
    default_type_config:
      payload_bytes: 4096
      children: 8
      fields_per_child: 3
      max_depth: 2
      string_len:
        min: 3
        max: 12

  telemetry:
    description: "Numeric bulk payload"
    category: numeric_bulk
    default_type_config:
      payload_bytes: 1024
      points: 32
      number_type: float64
      tag_count: 2
      string_len:
        min: 3
        max: 10

  strings:
    description: "Text bulk payload"
    category: text_bulk
    default_type_config:
      payload_bytes: 2048
      count: 32
      string_len:
        min: 3
        max: 16
      duplication: 0.1

  event:
    description: "Event envelope payload"
    category: envelope
    default_type_config:
      payload_bytes: 512
      attr_count: 4
      string_len:
        min: 3
        max: 12
      include_payload_bytes: 0
